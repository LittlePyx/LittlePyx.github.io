# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 小P的猫舍
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 爱玩毛线
    - 喵喵喵
    - 爱学习

description: '小P的学习、研究、生活记录'
keywords: 博客、技术、记录
language: zh-CN
timezone: Asia/Shanghai


avatar:
  img: /img/kamuyi.jpg
  effect: true
author:
  name: LittlePyx
  link: https://github.com/LittlePyx


social:
  fab fa-github: https://github.com/LittlePyx || GitHub
  fas fa-envelope: mailto:627875273@qq.com || Email
  fas fa-code: /algorithm/ || 算法笔记

menu:
  首页: / || fas fa-home
  算法笔记: /algorithm/ || fas fa-code
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

# ===============================
# Top Image (首页大图)
# ===============================
favicon: /img/favicon.png
index_img: /img/archive.webp
archive_img: /img/index.webp
tag_img: /img/tag.webp
category_img: /img/category.webp
cover: 
  default: /img/cover-default.webp
  type: both
top:
  progress:
    enable: true
toc:
  enable: false
  number: true
  expand_all: false
  init_open: true
# ===============================
# Image Viewer
# ===============================




medium_zoom: true

search:
  use: local_search
  placeholder: 搜索文章、算法笔记...
  local_search:
    preload: false
    top_n_per_article: 2
    unescape: true
    CDN:

highlight_theme: mac
highlight_copy: true
highlight_lang: true

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://littlepyx.github.io
root: /

permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - '**/*.html'

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: Butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/LittlePyx/LittlePyx.github.io.git
  branch: main


scroll:
  smooth: true

preloader:
  enable: false

# ===== Home Card =====
index_post_content:
  method: 3      # 1: 摘要 2: 截断 3: 封面卡片（推荐）

# 封面比例与显示


categories:
  - Research     # 研究 / 论文 / 实验
  - Notes        # 学习笔记
  - Projects     # 项目
  - Life         # 生活

aside:
  card_announcement:
    enable: true
    content: |
      <strong>教育经历</strong><br>
      本科：杭州电子科技大学<br>
      研究生：电子科技大学<br><br>
      <strong>研究方向</strong><br>
      AI Agent 开发、计算成像、深度学习、光学<br><br>
      新增：代码随想录算法刷题笔记整理中，按题型与算法模板归纳。

# 关闭不蒜子访问统计，避免侧边栏显示异常访客数和浏览量
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false


# ======================================
# Background & Particle Effect
# ======================================

# 顶部大图渐变（首页）


# 粒子背景
canvas_nest:
  enable: true
  color: "0, 122, 204"   # RGB
  opacity: 0.6
  zIndex: -1
  count: 60

# MathJax
#关于 per_page
# 如果设置为 true，将在每个页面加载 mathjax/katex 脚本
# 如果设置为 false，将根据你的设置加载 mathjax/katex 脚本（在页面的 front-matter 中添加 'mathjax: true' 或者 'katex: true'）
math:
   # 选择：mathjax, katex
  # 如果不需要数学公式，保持为空
  use: katex
  per_page: false
  hide_scrollbar: false

  mathjax:
    # 启用上下文菜单
    enableMenu: true
     # 选择：all / ams / none，这控制是否对公式编号以及如何编号
    tags: none

  katex:
     # 启用复制 KaTeX 公式
    copy_tex: true


inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">

# Markdown-it 渲染配置
# Markdown-it 渲染配置
# Markdown-it 渲染配置
# Markdown-it 渲染配置 (KaTeX 版)

post_cover:
  enable: true
  style:
    filter: true

# 文章按时间从旧到新阅读：左侧上一篇，右侧下一篇
post_pagination: 2

# 推荐区保持紧凑，桌面端正好排成 2 × 2
related_post:
  enable: true
  limit: 4
  date_type: created

lazyload:
  enable: true
  native: true
  field: site
  placeholder:
  blur: false

